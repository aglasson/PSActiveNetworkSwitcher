---
name: CI

on: [push, pull_request]

jobs:
  pester-tests:
    name: Pester unit tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./Tests -CI

  lint:
    name: MegaLinter
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: MegaLinter
        uses: oxsecurity/megalinter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_LINTERS: >-
            POWERSHELL_PSSCRIPTANALYZER,
            YAML_YAMLLINT,
            MARKDOWN_MARKDOWNLINT
          DISABLE_ERRORS: false
          DISABLE_WARNINGS: false
          DISABLE_INFO: false
